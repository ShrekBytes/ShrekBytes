<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 212" role="img" aria-label="Terminal: shrekbytes, Software Engineer. Stack: Python, Backend, DevOps. Interests: Gaming, Memes, Tech Enthusiast." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="c1"><rect x="24" y="6" width="0" height="30"><animate attributeName="width" calcMode="discrete" values="0;9.6;19.2;28.8;38.4;48;57.6;57.6" keyTimes="0;0.119;0.1333;0.1476;0.1619;0.1762;0.1905;1" dur="2.1s" begin="0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="24" y="66" width="0" height="30"><animate attributeName="width" calcMode="discrete" values="0;9.6;19.2;28.8;38.4;48;57.6;67.2;76.8;86.4;86.4" keyTimes="0;0.4048;0.419;0.4333;0.4476;0.4619;0.4762;0.4905;0.5048;0.519;1" dur="2.1s" begin="0s" fill="freeze"/></rect></clipPath>
  </defs>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">
    <!-- $ whoami -->
    <text x="4" y="28" fill="#2ea043">$</text>
    <text x="24" y="28" fill="#7d8590" textLength="57.6" lengthAdjust="spacing" clip-path="url(#c1)">whoami</text>
    <text x="4" y="54" fill="#7d8590" opacity="0">shrekbytes<set attributeName="opacity" to="1" begin="0.55s" fill="freeze"/></text>

    <!-- $ fastfetch -->
    <text x="4" y="88" fill="#2ea043" opacity="0">$<set attributeName="opacity" to="1" begin="0.7s" fill="freeze"/></text>
    <text x="24" y="88" fill="#7d8590" textLength="86.4" lengthAdjust="spacing" clip-path="url(#c2)">fastfetch</text>

    <g opacity="0"><set attributeName="opacity" to="1" begin="1.35s" fill="freeze"/>
      <path d="M10 96V124M10 111H22" stroke="#6e7681" stroke-width="1.5" fill="none"/>
      <text x="28" y="116" fill="#a371f7" font-weight="bold">role</text>
      <text x="140" y="116" fill="#7d8590">Software Engineer</text>
    </g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/>
      <path d="M10 124V150M10 137H22" stroke="#6e7681" stroke-width="1.5" fill="none"/>
      <text x="28" y="142" fill="#a371f7" font-weight="bold">stack</text>
      <text x="140" y="142" fill="#7d8590">Python <tspan fill="#6e7681">/</tspan> Backend <tspan fill="#6e7681">/</tspan> DevOps</text>
    </g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="1.65s" fill="freeze"/>
      <path d="M10 150V163H22" stroke="#6e7681" stroke-width="1.5" fill="none"/>
      <text x="28" y="168" fill="#a371f7" font-weight="bold">interests</text>
      <text x="140" y="168" fill="#7d8590">Gaming <tspan fill="#6e7681">/</tspan> Memes <tspan fill="#6e7681">/</tspan> Tech Enthusiast</text>
    </g>

    <!-- idle prompt -->
    <text x="4" y="202" fill="#2ea043" opacity="0">$<set attributeName="opacity" to="1" begin="1.85s" fill="freeze"/></text>

    <!-- cursor: follows the typing, then blinks -->
    <rect x="24" y="15" width="9" height="17" fill="#7d8590">
      <animate attributeName="x" calcMode="discrete" values="24;33.6;43.2;52.8;62.4;72;81.6;24;33.6;43.2;52.8;62.4;72;81.6;91.2;100.8;110.4;24;24" keyTimes="0;0.119;0.1333;0.1476;0.1619;0.1762;0.1905;0.3333;0.4048;0.419;0.4333;0.4476;0.4619;0.4762;0.4905;0.5048;0.519;0.881;1" dur="2.1s" begin="0s" fill="freeze"/>
      <animate attributeName="y" calcMode="discrete" values="15;15;15;15;15;15;15;75;75;75;75;75;75;75;75;75;75;189;189" keyTimes="0;0.119;0.1333;0.1476;0.1619;0.1762;0.1905;0.3333;0.4048;0.419;0.4333;0.4476;0.4619;0.4762;0.4905;0.5048;0.519;0.881;1" dur="2.1s" begin="0s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
